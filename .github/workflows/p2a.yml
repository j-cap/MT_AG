name: P2A four-node benchmark

on:
  push:
    branches:
      - phase2/p2a-multinode-benchmark
    paths:
      - src/mt_ag/fleet_simulation.py
      - src/mt_ag/joint_ekf.py
      - configs/phase2a.yaml
      - experiments/run_phase2a.py
      - experiments/generate_phase2a_figures.py
      - tests/test_phase2a.py
      - .github/workflows/p2a.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint P2A
        run: ruff check src/mt_ag/fleet_simulation.py src/mt_ag/joint_ekf.py experiments/run_phase2a.py experiments/generate_phase2a_figures.py tests/test_phase2a.py
      - name: Test P2A
        run: pytest -q tests/test_phase2a.py
      - name: Run P2A benchmark
        run: python experiments/run_phase2a.py
      - name: Generate P2A report figures
        run: python experiments/generate_phase2a_figures.py
      - name: Commit compact results and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/phase2/p2a report/figures/phase2/*.pdf
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Add P2A benchmark results and detailed figures"
          git push
