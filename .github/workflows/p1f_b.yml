name: P1F-B Experiment

on:
  push:
    branches: ["phase1/p1f-b"]
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run P1F-B campaign
        run: python experiments/run_phase1f_b.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: p1f-b-results
          path: results/phase1/p1f_b
