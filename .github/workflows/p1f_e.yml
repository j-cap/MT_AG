name: P1F-E Experiment

on:
  push:
    branches:
      - phase1/p1f-e
    paths:
      - configs/phase1f_e.yaml
      - experiments/run_phase1f_e.py
      - src/mt_ag/observability.py
      - src/mt_ag/paper_pf.py
      - src/mt_ag/aacopf.py
      - src/mt_ag/simulation.py
      - tests/test_phase1.py
      - .github/workflows/p1f_e.yml
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Run P1F-E negative controls
        run: python experiments/run_phase1f_e.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: p1f-e-results
          path: results/phase1/p1f_e
