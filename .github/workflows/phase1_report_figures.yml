name: Phase 1 report figures

on:
  push:
    branches:
      - report/phase1-figures
    paths:
      - experiments/generate_report_figures.py
      - results/phase1/trajectory_report.csv
      - results/phase1/p1c/summary.json
      - results/phase1/p1d/diagnostics_report.csv
      - results/phase1/p1f_c/tuning_report.csv
      - results/phase1/p1f_d/paired_report_1200.csv
      - .github/workflows/phase1_report_figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" pandas
      - name: Generate figures
        run: python experiments/generate_report_figures.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/figures/phase1/*.pdf
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
            exit 0
          fi
          git commit -m "Generate Phase 1 report figures"
          git push
