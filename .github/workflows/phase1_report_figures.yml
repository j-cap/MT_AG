name: Phase 1 report figures

on:
  push:
    branches:
      - main
    paths:
      - experiments/generate_report_figures.py
      - results/phase1/**
      - .github/workflows/phase1_report_figures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]" pandas
      - name: Lint figure generator
        run: ruff check experiments/generate_report_figures.py
      - name: Generate figures
        run: python experiments/generate_report_figures.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report/figures/phase1/*.pdf
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
            exit 0
          fi
          git commit -m "Generate complete Phase 1 report figure set"
          git push
