name: P1F-D Experiment

on:
  push:
    paths:
      - "configs/phase1f_d.yaml"
      - "experiments/run_phase1f_d.py"
      - ".github/workflows/p1f_d.yml"
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run P1F-D matched comparison
        run: python experiments/run_phase1f_d.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: p1f-d-results
          path: results/phase1/p1f_d
