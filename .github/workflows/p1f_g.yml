name: P1F-G Scalable AACOPF

on:
  push:
    branches:
      - phase1/p1f-g
    paths:
      - .github/workflows/p1f_g.yml
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint P1F-G
        run: ruff check src/mt_ag/scalable_aacopf.py tests/test_scalable_aacopf.py experiments/run_phase1f_g.py
      - name: Test scalable transition
        run: pytest -q tests/test_scalable_aacopf.py
      - name: Run P1F-G
        run: python experiments/run_phase1f_g.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: p1f-g-results
          path: |
            results/phase1/p1f_g/summary.json
            results/phase1/p1f_g/summary.md
            results/phase1/p1f_g/raw_results.json
