[project]
name = "mt-ag"
version = "0.1.0"
description = "Research code for collaborative UWB-IMU localization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
